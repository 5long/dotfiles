#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
email = "callme5long@gmail.com"
name = "Whyme Lyu"

[ui]
default-command = ["log", "--stat"]
diff-formatter = ":git"
merge-editor = "vimdiff"
pager = "delta"
diff-editor = ":builtin"

[revsets]
bookmark-advance-to = "tug_target()"

[revset-aliases]
'locals()' = "subject(glob:':local:*')"
'tug_target()' = "heads(::@- ~ locals())"

[aliases]
# New official replacement of tug
ba = ["bookmark", "advance"]
di = ["diff"]
# dn is short for down
dn = ["git", "fetch"]
ic = ["commit", "-i"]
ph = ["git", "push"]
rb = ["rebase", "-o", "trunk()"]
sclone = ["git", "clone", "--depth", "1"]
showtug = ["log", "-r", "tug_target()"]
tug = ["bookmark", "move", "-f", "heads(::@- & bookmarks())", "-t", "tug_target()"]
tuglocals = ["rebase", "-r", "locals()", "-B", "@"]

up = ["util", "exec", "--", "bash", "-c", """
  set -eu
  jj tuglocals
  jj tug
  jj ph
""", ""]

[git]
private-commits = "locals()"

[templates]
draft_commit_description = '''
concat(
  builtin_draft_commit_description,
  "\nJJ: ignore-rest\n",
  diff.git(),
)
'''
