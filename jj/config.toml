#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Whyme Lyu"
email = "callme5long@gmail.com"

[ui]
pager = "delta"
diff-formatter = ":git"
default-command = "log"

[revset-aliases]
'locals()' = "subject(glob:':local:*')"

[aliases]
di = ["diff"]
ic = ["commit", "-i"]
movelocals = ["rebase", "-r", "locals()", "-B", "@"]
ph = ["git", "push"]
tug = ["bookmark", "move", "-f", "heads(::@- & bookmarks())", "-t", "@-"]

[git]
private-commits = "locals()"

[templates]
draft_commit_description = '''
concat(
  builtin_draft_commit_description,
  "\nJJ: ignore-rest\n",
  diff.git(),
)
'''
